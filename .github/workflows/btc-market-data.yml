name: Free BTC OHLCV snapshots
on:
  push:
    paths:
      - '.github/workflows/btc-market-data.yml'
      - 'btc-refresh-trigger.txt'
  schedule:
    - cron: '9,29,49 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch actual public-exchange candles
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, datetime
          NOW = int(time.time())
          
          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent":"btc-ohlcv-free-snapshot/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          
          def pack(candles, minutes, count):
              cutoff = minutes * 60
              out = []
              for c in candles:
                  ts = int(c[0])
                  if ts + cutoff > NOW:
                      continue
                  out.append([ts, float(c[1]),float(c[2]),float(c[3]),float(c[4]),float(c[5])])
              out.sort(key=lambda c:c[0])
              if not out or NOW - out[-1][0] > cutoff * 2 + 900:
                  raise RuntimeError("Stale OHLCV candles")
              return out[-count:]
          
          def kraken():
              rows={}
              for k, minutes, count in (("h1",60,48),("h4",240,65),("d1",1440,35)):
                  url="https://api.kraken.com/0/public/OHLC?" + urllib.parse.urlencode({"pair":"XBTUSD","interval":minutes})
                  r=get_json(url)
                  if r.get("error"): raise RuntimeError(str(r["error"]))
                  raw = next(v for k,v in r["result"].items() if k!="last")
                  rows[k]=pack([[c[0],c[1],c[2],c[3],c[4],c[6]] for c in raw], minutes, count)
              tick=get_json("https://api.kraken.com/0/public/Ticker?pair=XBTUSD")
              if tick.get("error"): raise RuntimeError(str(tick["error"]))
              p=next(iter(tick["result"].values()))
              return "Kraken", float(p["c"][0]), rows
          
          def bitstamp():
              rows={}
              for k, minutes, count in (("h1",60,48),("h4",240,65),("d1",1440,35)):
                  url="https://www.bitstamp.net/api/v2/ohlc/btcusd/?" + urllib.parse.urlencode({"step":minutes*60,"limit":count+4,"exclude_current_candle":"true"})
                  d=get_json(url)
                  if "data" not in d or "ohlc" not in d["data"]:raise RuntimeError("Unexpected Bitstamp OHLC response")
                  raw = d["data"]["ohlc"]
                  rows[k]=pack([[c["timestamp"],c["open"],c["high"],c["low"],c["close"],c["volume"]] for c in raw],minutes,count)
              t=get_json("https://www.bitstamp.net/api/v2/ticker/btcusd/")
              return "Bitstamp", float(t["last"]),rows
          
          try:
              exchange,price,candles=kraken()
          except Exception as e:
              print("Kraken unavailable: "+repr(e))
              exchange,price,candles=bitstamp()
          snapshot={
              "fetched_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "fetched_at_unix":NOW,
              "pair":"BTC/USD",
              "exchange":exchange,
              "last_trade_price_at_fetch_usd":price,
              "price_time_note":"Ticker fetched at fetched_at_utc; exchange did not provide last-trade timestamp",
              "columns":["open_unix_utc","open","high","low","close","volume_BTC"],
              "closed_candles":candles,
              "note":"Candles are exchange OHLCV; last incomplete candle excluded. Intraday references are UTC aligned."
          }
          with open("btc-ohlcv-snapshot.json","w") as f: json.dump(snapshot,f,separators=(",",":"))
          print("Updated",exchange,"price",price,"last closed 4H",candles["h4"][-1][:5])
          PY
      - name: Save refreshed market snapshot
        run: |
          git config user.name "btc-market-data-bot"
          git config user.email "btc-market-data-bot@users.noreply.github.com"
          git add btc-ohlcv-snapshot.json
          git diff --cached --quiet || (git commit -m "Update public BTC OHLCV snapshot [skip ci]" && git push)
